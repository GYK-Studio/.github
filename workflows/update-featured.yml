name: Auto-Update Featured Project

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta diariamente a las 00:00 UTC
  workflow_dispatch:     # Permite ejecutarlo manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  update-featured:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Update Featured Project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');

          async function run() {
            const org = 'GYK-Studio';
            const headers = {
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Featured-Updater'
            };
            if (process.env.GH_TOKEN) {
              headers['Authorization'] = `token ${process.env.GH_TOKEN}`;
            }

            // 1. Obtener los repositorios públicos de la organización
            const res = await fetch(`https://api.github.com/orgs/${org}/repos?type=public&sort=pushed&per_page=100`, { headers });
            if (!res.ok) throw new Error(`Error API: ${res.statusText}`);
            const repos = await res.json();

            // Filtrar para ignorar forks y el repo especial .github
            const nonForks = repos.filter(r => !r.fork && r.name !== '.github');

            // 2. Prioridad: el repo que tenga el topic "featured" más recientemente actualizado.
            // Si ninguno lo tiene, toma el último repo original actualizado.
            let featured = nonForks.find(r => Array.isArray(r.topics) && r.topics.includes('featured'));
            if (!featured) {
              featured = nonForks[0];
            }

            if (!featured) {
              console.log('No se encontró ningún repositorio elegible.');
              return;
            }

            console.log(`Proyecto destacado seleccionado: ${featured.name}`);

            const topicsBadges = (featured.topics || [])
              .filter(t => t !== 'featured')
              .slice(0, 4)
              .map(t => `<img src="https://img.shields.io/badge/${encodeURIComponent(t)}-1F6FEB?style=flat-square" alt="${t}"/>`)
              .join('\n');

            const newContent = `<!-- FEATURED:START -->
          <table>
          <tr>
          <td width="100%" valign="top">

          <h3>🎬 <a href="${featured.html_url}">${featured.name}</a></h3>

          ${featured.description || 'No description provided.'}

          <p>
          <img src="https://img.shields.io/github/stars/${org}/${featured.name}?style=flat-square&logo=github&color=1F6FEB" alt="Stars"/>
          <img src="https://img.shields.io/github/last-commit/${org}/${featured.name}?style=flat-square&color=8957E5" alt="Last Commit"/>
          <img src="https://img.shields.io/github/license/${org}/${featured.name}?style=flat-square&color=2EA043" alt="License"/>
          </p>

          ${topicsBadges ? `<p>\n${topicsBadges}\n</p>` : ''}

          <a href="${featured.html_url}">
          <img src="https://img.shields.io/badge/Open%20Repository-181717?style=for-the-badge&logo=github&logoColor=white" alt="Open ${featured.name}"/>
          </a>

          </td>
          </tr>
          </table>
          <!-- FEATURED:END -->`;

            // 3. Reemplazar el bloque en el README.md y README.es.md si existen
            const files = ['profile/README.md', 'README.md', 'profile/README.es.md'];
            for (const file of files) {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, 'utf-8');
                const regex = /<!-- FEATURED:START -->([\s\S]*?)<!-- FEATURED:END -->/;
                if (regex.test(content)) {
                  content = content.replace(regex, newContent);
                  fs.writeFileSync(file, content, 'utf-8');
                  console.log(`Actualizado: ${file}`);
                }
              }
            }
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --quiet && ! git diff --cached --quiet; then
            git commit -m "chore(readme): auto-update featured project"
            git push
          else
            echo "Sin cambios en el proyecto destacado."
          fi
