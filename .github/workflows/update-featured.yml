name: Auto-Update Featured Projects

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-featured:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Update Featured Projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'NODE_SCRIPT'
          const fs = require('fs');

          // Metadatos enriquecidos de los proyectos clave de GYK Studio
          const PROJECT_META = {
            'Web-GYK-Studio': {
              title: 'Web GYK Studio',
              icon: '🌐',
              desc_en: 'Official web platform and digital hub for GYK Studio.',
              desc_es: 'Plataforma web oficial y portal digital de GYK Studio.',
              techs: ['Astro', 'TypeScript', 'Tailwind'],
              colors: ['1F6FEB', '8957E5', '2EA043']
            },
            'NuvioWeb': {
              title: 'Nuvio Web',
              icon: '🎬',
              desc_en: 'TV-first multimedia experience for browsers & Smart TVs.',
              desc_es: 'Experiencia multimedia TV-first para navegadores y Smart TVs.',
              techs: ['TV-First', 'JavaScript', 'Streaming'],
              colors: ['8957E5', '1F6FEB', '2EA043']
            },
            'self-host-M': {
              title: 'Nuvio Self-Hosted',
              icon: '⚙️',
              desc_en: 'Self-hosted backend infrastructure and APIs for Nuvio.',
              desc_es: 'Infraestructura backend self-hosted y APIs para Nuvio.',
              techs: ['Backend', 'PostgreSQL', 'Docker'],
              colors: ['DB6D28', '1F6FEB', '2EA043']
            }
          };

          async function run() {
            const org = 'GYK-Studio';
            const headers = {
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Featured-Updater'
            };
            if (process.env.GH_TOKEN) {
              headers['Authorization'] = 'token ' + process.env.GH_TOKEN;
            }

            // Obtener repositorios ordenados por subidas / actividad reciente
            const res = await fetch('https://api.github.com/orgs/' + org + '/repos?type=public&sort=pushed&direction=desc&per_page=100', { headers });
            if (!res.ok) throw new Error('Error API: ' + res.statusText);
            const repos = await res.json();

            // Filtrar el repositorio de configuración .github
            const activeRepos = repos.filter(r => r.name !== '.github');
            const topProjects = activeRepos.slice(0, 4);

            function renderTable(projects, lang) {
              const isEs = lang === 'es';
              const thProj = isEs ? 'Proyecto' : 'Project';
              const thDesc = isEs ? 'Descripción' : 'Description';
              const thStack = isEs ? 'Tecnologías' : 'Technologies';
              const thAction = isEs ? 'Repositorio' : 'Repository';
              const btnText = isEs ? 'Explorar ↗' : 'Explore ↗';

              let rows = '';
              for (const p of projects) {
                const m = PROJECT_META[p.name] || {};
                const title = m.title || p.name;
                const icon = m.icon || '🚀';
                const desc = isEs ? (m.desc_es || p.description || 'Proyecto de GYK Studio.') : (m.desc_en || p.description || 'GYK Studio project.');
                const techs = m.techs || (p.language ? [p.language] : ['Open Source']);
                const colors = m.colors || ['1F6FEB', '8957E5', '2EA043'];

                const techBadges = techs.map((t, idx) => {
                  const color = colors[idx] || '1F6FEB';
                  return '<img src="https://img.shields.io/badge/' + encodeURIComponent(t) + '-' + color + '?style=flat-square" alt="' + t + '"/>';
                }).join(' ');

                rows += '<tr>\n' +
                  '<td valign="middle"><b>' + icon + ' <a href="' + p.html_url + '">' + title + '</a></b></td>\n' +
                  '<td valign="middle">' + desc + '</td>\n' +
                  '<td align="center" valign="middle">' + techBadges + '</td>\n' +
                  '<td align="center" valign="middle">\n' +
                  '<a href="' + p.html_url + '">\n' +
                  '<img src="https://img.shields.io/badge/' + encodeURIComponent(btnText) + '-181717?style=flat-square&logo=github&logoColor=white" alt="' + btnText + '"/>\n' +
                  '</a>\n' +
                  '</td>\n' +
                  '</tr>\n';
              }

              return '<!-- FEATURED:START -->\n' +
                '<table width="100%">\n' +
                '<thead>\n' +
                '<tr>\n' +
                '<th align="left">' + thProj + '</th>\n' +
                '<th align="left">' + thDesc + '</th>\n' +
                '<th align="center">' + thStack + '</th>\n' +
                '<th align="center">' + thAction + '</th>\n' +
                '</tr>\n' +
                '</thead>\n' +
                '<tbody>\n' +
                rows +
                '</tbody>\n' +
                '</table>\n' +
                '<!-- FEATURED:END -->';
            }

            const targets = [
              { paths: ['profile/README.md', 'README.md'], lang: 'en' },
              { paths: ['profile/README.es.md', 'README.es.md'], lang: 'es' }
            ];

            const regex = /<!-- FEATURED:START -->([\s\S]*?)<!-- FEATURED:END -->/;

            for (const target of targets) {
              const html = renderTable(topProjects, target.lang);
              for (const file of target.paths) {
                if (fs.existsSync(file)) {
                  let content = fs.readFileSync(file, 'utf-8');
                  if (regex.test(content)) {
                    content = content.replace(regex, html);
                    fs.writeFileSync(file, content, 'utf-8');
                    console.log('Actualizado con éxito (' + target.lang + '): ' + file);
                  }
                }
              }
            }
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE_SCRIPT

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(readme): auto-update featured projects [skip ci]"
            git push
            echo "Cambios subidos correctamente al repositorio."
          else
            echo "No hay cambios nuevos que subir."
          fi
