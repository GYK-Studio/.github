name: Auto-Update Featured Projects

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-featured:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Update Featured Projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'NODE_SCRIPT'
          const fs = require('fs');

          async function run() {
            const org = 'GYK-Studio';
            const headers = {
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Featured-Updater'
            };
            if (process.env.GH_TOKEN) {
              headers['Authorization'] = 'token ' + process.env.GH_TOKEN;
            }

            // Obtener repositorios ordenados por subidas / commits recientes
            const res = await fetch('https://api.github.com/orgs/' + org + '/repos?type=public&sort=pushed&direction=desc&per_page=100', { headers });
            if (!res.ok) throw new Error('Error API: ' + res.statusText);
            const repos = await res.json();

            // Filtrar el repositorio de configuración .github
            const activeRepos = repos.filter(r => r.name !== '.github');
            const topProjects = activeRepos.slice(0, 4);

            if (topProjects.length === 0) {
              console.log('No se encontraron repositorios activos.');
              return;
            }

            console.log('Proyectos activos detectados: ' + topProjects.map(p => p.name).join(', '));

            const FALLBACKS = {
              'Web-GYK-Studio': {
                desc_en: 'Official web platform and digital portal for GYK Studio.',
                desc_es: 'Plataforma web oficial y portal digital de GYK Studio.',
                tags: ['Astro', 'TypeScript', 'Web'],
                colors: ['BC52EE', '3178C6', '1F6FEB']
              },
              'NuvioWeb': {
                desc_en: 'A TV-first multimedia experience built for browsers and Smart TV platforms.',
                desc_es: 'Una experiencia multimedia TV-first creada para navegadores y plataformas Smart TV.',
                tags: ['TV-First', 'JavaScript', 'Streaming'],
                colors: ['8957E5', 'F7DF1E', '2EA043']
              },
              'self-host-M': {
                desc_en: 'Distributed backend infrastructure, database management and APIs for Nuvio.',
                desc_es: 'Infraestructura backend self-hosted, gestión de base de datos y APIs para Nuvio.',
                tags: ['Backend', 'PostgreSQL', 'Self-Hosted'],
                colors: ['DB6D28', '4169E1', '2EA043']
              }
            };

            function renderCards(projects, lang) {
              const isEs = lang === 'es';
              const openText = isEs ? 'Ver Repositorio' : 'Open Repository';
              const defaultDesc = isEs ? 'Proyecto activo de GYK Studio.' : 'Active GYK Studio project.';

              const cards = projects.map(p => {
                const fb = FALLBACKS[p.name] || {};

                // Si la descripción en GitHub tiene sustancia (>15 caracteres), usarla; si no, usar fallback
                let desc = (p.description && p.description.trim().length > 15) ? p.description.trim() : null;
                if (!desc) {
                  desc = isEs ? (fb.desc_es || defaultDesc) : (fb.desc_en || defaultDesc);
                }

                let tags = fb.tags;
                let colors = fb.colors || ['1F6FEB', '8957E5', '2EA043'];
                if (!tags) {
                  tags = [];
                  if (p.language) tags.push(p.language);
                  if (Array.isArray(p.topics)) {
                    for (const t of p.topics) {
                      if (!tags.includes(t)) tags.push(t);
                    }
                  }
                  if (tags.length === 0) tags.push('Open Source');
                }

                const techBadges = tags.slice(0, 4).map((t, idx) => {
                  const c = colors[idx % colors.length] || '1F6FEB';
                  return '<img src="https://img.shields.io/badge/' + encodeURIComponent(t) + '-' + c + '?style=flat-square" alt="' + t + '"/>';
                }).join(' ');

                return '<table>\n' +
                  '<tr>\n' +
                  '<td width="100%" valign="top">\n\n' +
                  '<a href="' + p.html_url + '">\n' +
                  '<img align="right" src="https://img.shields.io/badge/' + encodeURIComponent(openText) + '-181717?style=for-the-badge&logo=github&logoColor=white" alt="' + openText + '"/>\n' +
                  '</a>\n\n' +
                  '<p><font size="+1"><b><a href="' + p.html_url + '">' + p.name + '</a></b></font></p>\n\n' +
                  desc + '\n\n' +
                  '<br><br>\n\n' +
                  '<p>\n' +
                  techBadges + '\n' +
                  '<img src="https://img.shields.io/github/last-commit/' + org + '/' + p.name + '?style=flat-square&color=21262D&labelColor=161B22&logo=git&logoColor=white" alt="Last Commit"/>\n' +
                  '</p>\n\n' +
                  '</td>\n' +
                  '</tr>\n' +
                  '</table>';
              }).join('\n\n<br>\n\n');

              return '<!-- FEATURED:START -->\n' + cards + '\n<!-- FEATURED:END -->';
            }

            const targets = [
              { paths: ['profile/README.md', 'README.md'], lang: 'en' },
              { paths: ['profile/README.es.md', 'README.es.md'], lang: 'es' }
            ];

            const regex = /<!-- FEATURED:START -->([\s\S]*?)<!-- FEATURED:END -->/;

            for (const target of targets) {
              const html = renderCards(topProjects, target.lang);
              for (const file of target.paths) {
                if (fs.existsSync(file)) {
                  let content = fs.readFileSync(file, 'utf-8');
                  if (regex.test(content)) {
                    content = content.replace(regex, html);
                    fs.writeFileSync(file, content, 'utf-8');
                    console.log('Actualizado con éxito (' + target.lang + '): ' + file);
                  }
                }
              }
            }
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE_SCRIPT

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(readme): auto-update featured projects [skip ci]"
            git push
            echo "Cambios subidos correctamente al repositorio."
          else
            echo "No hay cambios nuevos que subir."
          fi
