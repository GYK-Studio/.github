name: Auto-Update Featured Projects

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta diariamente a medianoche UTC
  workflow_dispatch:     # Permite ejecutarlo manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  update-featured:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Update Featured Projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - << 'EOF'
          const fs = require('fs');

          async function run() {
            const org = 'GYK-Studio';
            const headers = {
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Featured-Projects-Updater'
            };
            if (process.env.GH_TOKEN) {
              headers['Authorization'] = `token ${process.env.GH_TOKEN}`;
            }

            // 1. Obtener los repositorios ordenados por subidas/commits recientes
            const res = await fetch(`https://api.github.com/orgs/${org}/repos?type=public&sort=pushed&direction=desc&per_page=100`, { headers });
            if (!res.ok) throw new Error(`Error API: ${res.statusText}`);
            const repos = await res.json();

            // Filtrar forks y el repositorio de configuración .github
            const originalRepos = repos.filter(r => !r.fork && r.name !== '.github');

            // Tomar los 4 proyectos más activos
            const topProjects = originalRepos.slice(0, 4);

            if (topProjects.length === 0) {
              console.log('No se encontraron repositorios originales.');
              return;
            }

            console.log(`Proyectos seleccionados: ${topProjects.map(p => p.name).join(', ')}`);

            // Función para renderizar el bloque HTML en formato rejilla 2 columnas
            function renderHTML(projects, lang = 'es') {
              const isEs = lang === 'es';
              const openRepoText = isEs ? 'Ver Repositorio' : 'Open Repository';
              const noDescText = isEs ? 'Proyecto activo de GYK Studio.' : 'Active GYK Studio project.';

              let rows = '';
              for (let i = 0; i < projects.length; i += 2) {
                const p1 = projects[i];
                const p2 = projects[i + 1];

                const renderCard = (p) => {
                  if (!p) return '<td width="50%" valign="top"></td>';
                  const desc = p.description || noDescText;
                  const topics = (p.topics || []).slice(0, 3)
                    .map(t => `<img src="https://img.shields.io/badge/${encodeURIComponent(t)}-1F6FEB?style=flat-square" alt="${t}"/>`)
                    .join(' ');

                  return `
          <td width="50%" valign="top">

          <h3>🚀 <a href="${p.html_url}">${p.name}</a></h3>

          ${desc}

          <p>
          <img src="https://img.shields.io/github/stars/${org}/${p.name}?style=flat-square&logo=github&color=1F6FEB" alt="Stars"/>
          <img src="https://img.shields.io/github/last-commit/${org}/${p.name}?style=flat-square&color=8957E5" alt="Last Commit"/>
          <img src="https://img.shields.io/github/license/${org}/${p.name}?style=flat-square&color=2EA043" alt="License"/>
          </p>

          ${topics ? `<p>${topics}</p>` : ''}

          <a href="${p.html_url}">
          <img src="https://img.shields.io/badge/${encodeURIComponent(openRepoText)}-181717?style=for-the-badge&logo=github&logoColor=white" alt="${openRepoText}"/>
          </a>

          </td>`;
                };

                rows += `
          <tr>
          ${renderCard(p1)}
          ${renderCard(p2)}
          </tr>`;
              }

              return `<!-- FEATURED:START -->\n<table>${rows}\n</table>\n<!-- FEATURED:END -->`;
            }

            // 2. Actualizar archivos en inglés y español si existen
            const targets = [
              { paths: ['profile/README.md', 'README.md'], lang: 'en' },
              { paths: ['profile/README.es.md', 'README.es.md'], lang: 'es' }
            ];

            const regex = /<!-- FEATURED:START -->([\s\S]*?)<!-- FEATURED:END -->/;

            for (const target of targets) {
              const html = renderHTML(topProjects, target.lang);
              for (const file of target.paths) {
                if (fs.existsSync(file)) {
                  let content = fs.readFileSync(file, 'utf-8');
                  if (regex.test(content)) {
                    content = content.replace(regex, html);
                    fs.writeFileSync(file, content, 'utf-8');
                    console.log(`Actualizado (${target.lang}): ${file}`);
                  }
                }
              }
            }
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --quiet && ! git diff --cached --quiet; then
            git commit -m "chore(readme): auto-update most active projects"
            git push
          else
            echo "Sin cambios en los proyectos destacados."
          fi
